[package]
name = "sigtrail-cli"
version = "0.1.0"
edition = "2024"
description = "Command Line Interface to interact with the SigTrail back-end"
authors = ["Jarl Brand <jarl.brand@gmail.com>"]
license = "Apache-2.0"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
anyhow = "1.0.97"
sigtrail-rs = { path = "../sigtrail-rs" }
log = "0.4.33"
pretty_env_logger = "0.5.0"